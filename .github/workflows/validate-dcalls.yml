name: Validate Dcalls

on:
  push:
    branches:
      - feature-username-authentication
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Firebase rules test tools
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing firebase-tools
      - name: Test Firestore security rules in emulator
        run: npx firebase emulators:exec --only firestore,storage --project demo-dcalls-rules "node --test tests/firestore.rules.test.js tests/storage.rules.test.js"
      - name: Type-check
        run: npm run lint
      - name: Build web application
        run: npm run build
