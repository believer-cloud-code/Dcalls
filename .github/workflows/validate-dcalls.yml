name: Validate Dcalls

on:
  push:
    branches:
      - feature-username-authentication
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Report dependency vulnerabilities
        run: |
          npm audit --json > /tmp/dcalls-npm-audit.json || true
          node -e "const a=require('/tmp/dcalls-npm-audit.json'); console.log('Dependency vulnerability totals:', JSON.stringify(a.metadata?.vulnerabilities ?? {})); for (const [name, v] of Object.entries(a.vulnerabilities ?? {})) { const via=(v.via ?? []).map(x => typeof x === 'string' ? x : (x.title ?? x.name ?? 'advisory')).join('; '); console.log([v.severity.toUpperCase(), name, v.isDirect ? 'direct' : 'transitive', 'range='+v.range, 'fix='+JSON.stringify(v.fixAvailable), 'via='+via].join(' | ')); }"
      - name: Install Firebase rules test tools
        run: npm install --no-save --package-lock=false @firebase/rules-unit-testing firebase-tools
      - name: Test Firestore security rules in emulator
        run: npx firebase emulators:exec --only firestore --project demo-dcalls-rules "node --test tests/firestore.rules.test.js"
      - name: Test Storage security rules in emulator
        run: npx firebase emulators:exec --only firestore,storage --project demo-dcalls-rules "node --test tests/storage.rules.test.js"
      - name: Type-check
        run: npm run lint
      - name: Build web application
        run: npm run build
      - name: Install Cloudflare Worker dependencies
        run: npm ci --prefix cloudflare
      - name: Validate Cloudflare Worker bundle
        working-directory: cloudflare
        run: npx wrangler deploy --dry-run --outdir /tmp/dcalls-worker-dist
